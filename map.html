<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoGuessr Map Pins</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px system-ui, sans-serif; display: flex; height: 100vh; color: #222; }
  #side { width: 340px; padding: 12px; overflow-y: auto; border-right: 1px solid #ccc; background: #fafafa; }
  #map { flex: 1; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  h2 { font-size: 13px; margin: 16px 0 6px; text-transform: uppercase; color: #666; }
  textarea { width: 100%; height: 120px; font: 12px monospace; }
  button { cursor: pointer; margin: 4px 4px 0 0; }
  .item { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid #eee; }
  .item span.name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { display: inline-block; background: #e0e7ff; border-radius: 10px; padding: 1px 8px; margin: 2px 2px 0 0; font-size: 12px; cursor: pointer; }
  .tag:hover { background: #fecaca; }
  #pv { display: none; position: fixed; right: 12px; bottom: 24px; z-index: 1500; width: min(640px, 60vw); height: min(440px, 55vh);
        background: #111; border-radius: 6px; box-shadow: 0 2px 12px #000a; flex-direction: column; overflow: hidden; }
  #pv.open { display: flex; }
  #pv.big { width: calc(100vw - 24px); height: calc(100vh - 48px); }
  #pvBar { padding: 4px 8px; background: #222; color: #fff; display: flex; gap: 8px; align-items: center; font-size: 12px; }
  #pvBar button { margin: 0; }
  #pvBar input[type=number] { width: 52px; }
  #pvView { flex: 1; min-height: 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 2px #000; flex: none; }
  #status { font-size: 12px; color: #a40; white-space: pre-wrap; margin-top: 6px; }
  @media (max-width: 700px) { body { flex-direction: column-reverse; } #side { width: 100%; height: 45vh; } }
</style>
</head>
<body>
<div id="side">
  <h1>GeoGuessr Map Pins</h1>
  <input type="file" id="files" accept=".json,application/json" multiple>
  <div id="status"></div>

  <h2>Loaded files</h2>
  <div id="fileList"></div>

  <h2>Tag filter (map + export)</h2>
  <select id="tagFilter"></select>
  <div class="hint" style="font-size:12px;color:#666;margin-top:4px">Click a pin to add tags. Use the 🏷 button on a file to tag all its pins.</div>

  <h2>Baidu Street View links (one per line)</h2>
  <textarea id="links" placeholder="https://map.baidu.com/@11590057.96,4489812.75,5z#panoid=...&panotype=street&heading=238.86&pitch=-4.98..."></textarea>
  <div>
    <button id="addLinks">Add / update links</button>
    <button id="exportBtn">Export selection as JSON</button>
    <button id="clearAll">Clear all</button>
  </div>
  <div id="linkInfo"></div>
</div>
<div id="map"></div>
<div id="pv">
  <div id="pvBar">
    <span id="pvTitle" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1"></span>
    <button id="pvBig">⤢</button>
    <button id="pvClose">✕</button>
  </div>
  <div id="pvView"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>
<script>
const KEY = 'geo_pins_v1';
const COLORS = { google: '#e53935', baidu: '#1e88e5', link: '#43a047' };
let state = load(); // { files: [{id,name,type,locs:[...]}], links: [ {panoId,lat,lng,heading,pitch,approx,url} ] }

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.files && s.links) return s; } catch (e) {}
  return { files: [], links: [] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { setStatus('Could not save to localStorage (quota?): ' + e.message); }
}
function setStatus(t) { document.getElementById('status').textContent = t || ''; }

// ---------- map ----------
const map = L.map('map', { preferCanvas: true }).setView([30, 105], 3);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
const layer = L.layerGroup().addTo(map);

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function isBaiduPano(p) {
  return p.source === 'baidu_pano' || (p.extra && p.extra.tags && p.extra.tags.includes('baidu')) ||
    (typeof p.panoId === 'string' && /^[0-9A-Z]{20,}$/.test(p.panoId) && p.panoId.length !== 22);
}
function baiduUrl(id, h, p) {
  return `https://map.baidu.com/#panoid=${id}&panotype=street&heading=${h || 0}&pitch=${p || 0}&l=13&tn=B_NORMAL_MAP&sc=0&newmap=1&shareurl=1&pid=${id}`;
}
function googleUrl(l) {
  if (l.panoId) return `https://www.google.com/maps/@?api=1&map_action=pano&pano=${l.panoId}&heading=${l.heading || 0}&pitch=${l.pitch || 0}`;
  return `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${l.lat},${l.lng}`;
}

function popupNode(l, title, url) {
  const d = document.createElement('div');
  d.innerHTML = `<b>${esc(title)}</b><br>${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}` +
    (l.approx ? '<br><i>approximate position (could not look up pano)</i>' : '') +
    (l.panoId ? `<br><code>${esc(l.panoId)}</code>` : '') +
    `<br><a href="${esc(url)}" target="_blank" rel="noopener">Open street view</a>` +
    `<div class="tags"></div>` +
    `<input class="ti" placeholder="add tag + Enter" style="margin-top:6px;width:150px">`;
  const box = d.querySelector('.tags');
  const draw = () => {
    box.innerHTML = '';
    (l.tags || []).forEach(t => {
      const s = document.createElement('span'); s.className = 'tag'; s.title = 'click to remove'; s.textContent = t + ' ✕';
      s.onclick = () => { l.tags = l.tags.filter(x => x !== t); save(); draw(); refreshTagSelect(); };
      box.appendChild(s);
    });
  };
  draw();
  d.querySelector('.ti').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const t = e.target.value.trim();
    if (t) { l.tags = [...new Set([...(l.tags || []), t])]; save(); draw(); refreshTagSelect(); }
    e.target.value = '';
  });
  return d;
}

function allLocs() {
  return [...state.files.flatMap(f => f.locs), ...state.links];
}
function refreshTagSelect() {
  const el = document.getElementById('tagFilter');
  const cur = el.value || '__all';
  const tags = [...new Set(allLocs().flatMap(l => l.tags || []))].sort();
  el.innerHTML = '<option value="__all">All pins</option><option value="__none">Untagged</option>' +
    tags.map(t => `<option value="${esc(t)}">${esc(t)} (${allLocs().filter(l => (l.tags || []).includes(t)).length})</option>`).join('');
  el.value = [...el.options].some(o => o.value === cur) ? cur : '__all';
}
document.getElementById('tagFilter').addEventListener('change', () => redraw());

function redraw(fit) {
  refreshTagSelect();
  layer.clearLayers();
  const pts = [];
  const sel = document.getElementById('tagFilter').value || '__all';
  const show = l => sel === '__all' || (sel === '__none' ? !(l.tags && l.tags.length) : (l.tags || []).includes(sel));
  const add = (l, type, title, url) => {
    if (!show(l)) return;
    const m = L.circleMarker([l.lat, l.lng], {
      radius: 6, color: '#fff', weight: 1.5, fillColor: COLORS[type], fillOpacity: 0.95
    });
    m.bindPopup(() => popupNode(l, title, url));
    if (type !== 'google' && l.panoId) m.on('click', () => showPano(l));
    layer.addLayer(m);
    pts.push([l.lat, l.lng]);
  };
  for (const f of state.files) {
    for (const l of f.locs) {
      const baidu = f.type === 'baidu' || (f.type === 'mixed' && isBaiduPano(l));
      add(l, baidu ? 'baidu' : 'google', f.name, baidu ? baiduUrl(l.panoId, l.heading, l.pitch) : googleUrl(l));
    }
  }
  for (const l of state.links) add(l, 'link', 'Baidu link', l.url);
  if (fit && pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 12 });
  renderList();
}

function tagAll(locs) {
  const t = (prompt('Tag to add to all these pins:') || '').trim();
  if (!t) return;
  locs.forEach(l => { l.tags = [...new Set([...(l.tags || []), t])]; });
  save(); redraw();
}

function renderList() {
  const el = document.getElementById('fileList');
  el.innerHTML = '';
  const row = (color, label, onDel, onTag) => {
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = `<span class="dot" style="background:${color}"></span><span class="name" title="${esc(label)}">${esc(label)}</span>`;
    if (onTag) { const t = document.createElement('button'); t.textContent = '🏷'; t.title = 'Tag all pins'; t.onclick = onTag; d.appendChild(t); }
    const b = document.createElement('button'); b.textContent = '✕'; b.onclick = onDel; d.appendChild(b);
    el.appendChild(d);
  };
  state.files.forEach((f, i) => row(f.type === 'google' ? COLORS.google : COLORS.baidu,
    `${f.name} (${f.type}, ${f.locs.length})`, () => { state.files.splice(i, 1); save(); redraw(); }, () => tagAll(f.locs)));
  if (state.links.length) row(COLORS.link, `Baidu links (${state.links.length})`, () => {
    state.links = []; save(); redraw();
  }, () => tagAll(state.links));
  if (!el.children.length) el.textContent = 'Nothing loaded yet.';
}

// ---------- file upload ----------
document.getElementById('files').addEventListener('change', async e => {
  const msgs = [];
  for (const file of e.target.files) {
    try {
      const j = JSON.parse(await file.text());
      const arr = Array.isArray(j) ? j : j.customCoordinates;
      if (!Array.isArray(arr)) throw new Error('no customCoordinates array');
      const locs = arr.filter(p => isFinite(p.lat) && isFinite(p.lng)).map(p => ({
        lat: +p.lat, lng: +p.lng, heading: p.heading, pitch: p.pitch, panoId: p.panoId || null,
        b: isBaiduPano(p) ? 1 : 0
      }));
      const nb = locs.filter(l => l.b).length;
      const type = nb === locs.length ? 'baidu' : nb === 0 ? 'google' : 'mixed';
      locs.forEach(l => delete l.b);
      const name = (j.name ? j.name + ' – ' : '') + file.name;
      state.files = state.files.filter(f => f.name !== name); // re-upload replaces
      state.files.push({ id: Date.now() + Math.random(), name, type, locs });
      msgs.push(`${file.name}: ${locs.length} pins (${type})`);
    } catch (err) {
      msgs.push(`${file.name}: failed – ${err.message}`);
    }
  }
  e.target.value = '';
  save(); redraw(true); setStatus(msgs.join('\n'));
});

// ---------- Baidu coordinate conversion ----------
// BD09 Mercator -> BD09 lon/lat
const MCBAND = [12890594.86, 8362377.87, 5591021, 3481989.83, 1678043.12, 0];
const MC2LL = [
  [1.410526172116255e-8, 0.00000898305509648872, -1.9939833816331, 200.9824383106796, -187.2403703815547, 91.6087516669843, -23.38765649603339, 2.57121317296198, -0.03801003308653, 17337981.2],
  [-7.435856389565537e-9, 0.000008983055097726239, -0.78625201886289, 96.32687599759846, -1.85204757529826, -59.36935905485877, 47.40033549296737, -16.50741931063887, 2.28786674699375, 10260144.86],
  [-3.030883460898826e-8, 0.00000898305509983578, 0.30071316287616, 59.74293618442277, 7.357984074871, -25.38371002664745, 13.45380521110908, -3.29883767235584, 0.32710905363475, 6856817.37],
  [-1.981981304930552e-8, 0.000008983055099779535, 0.03278182852591, 40.31678527705744, 0.65659298677277, -4.44255534477492, 0.85341911805263, 0.12923347998204, -0.04625736007561, 4482777.06],
  [3.09191371068437e-9, 0.000008983055096812155, 0.00006995724062, 23.10934304144901, -0.00023663490511, -0.6321817810242, -0.00663494467273, 0.03430082397953, -0.00466043876332, 2555164.4],
  [2.890871144776878e-9, 0.000008983055095805407, -3.068298e-8, 7.47137025468032, -0.00000353937994, -0.02145144861037, -0.00001234426596, 0.00010322952773, -0.00000323890364, 826088.5]
];
function mc2bd(x, y) {
  const ay = Math.abs(y);
  let f = MC2LL[5];
  for (let i = 0; i < MCBAND.length; i++) if (ay >= MCBAND[i]) { f = MC2LL[i]; break; }
  const lng = f[0] + f[1] * Math.abs(x);
  const c = ay / f[9];
  const lat = f[2] + f[3] * c + f[4] * c ** 2 + f[5] * c ** 3 + f[6] * c ** 4 + f[7] * c ** 5 + f[8] * c ** 6;
  return [lng * (x < 0 ? -1 : 1), lat * (y < 0 ? -1 : 1)];
}
function bd2gcj(lng, lat) {
  const xp = Math.PI * 3000 / 180, x = lng - 0.0065, y = lat - 0.006;
  const z = Math.hypot(x, y) - 0.00002 * Math.sin(y * xp);
  const t = Math.atan2(y, x) - 0.000003 * Math.cos(x * xp);
  return [z * Math.cos(t), z * Math.sin(t)];
}
function outOfChina(lng, lat) { return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271; }
function gcjDelta(lng, lat) {
  const a = 6378245.0, ee = 0.00669342162296594323;
  const tl = (x, y) => -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x)) +
    (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI) + 20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI) +
     160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30)) * 2/3;
  const tg = (x, y) => 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x)) +
    (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI) + 20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI) +
     150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI)) * 2/3;
  let dLat = tl(lng - 105, lat - 35), dLng = tg(lng - 105, lat - 35);
  const rad = lat / 180 * Math.PI;
  let magic = Math.sin(rad); magic = 1 - ee * magic * magic;
  const sq = Math.sqrt(magic);
  dLat = dLat * 180 / ((a * (1 - ee)) / (magic * sq) * Math.PI);
  dLng = dLng * 180 / (a / sq * Math.cos(rad) * Math.PI);
  return [dLng, dLat];
}
function gcj2wgs(lng, lat) {
  if (outOfChina(lng, lat)) return [lng, lat];
  let wl = lng, wt = lat;
  for (let i = 0; i < 5; i++) { // iterate for accuracy
    const [dx, dy] = gcjDelta(wl, wt);
    wl = lng - dx; wt = lat - dy;
  }
  return [wl, wt];
}
// GeoGuessr's Baidu coordinates are GCJ02 (verified against sdata for a sample pano), so keep GCJ02
function mc2wgs(x, y) {
  const [bl, bt] = mc2bd(x, y);
  return bd2gcj(bl, bt);
}

// Ask Baidu for the real pano position (may fail because of CORS -> fallback to URL coords)
async function lookupPano(id) {
  try {
    const r = await fetch(`https://mapsv0.bdimg.com/?qt=sdata&sid=${id}`);
    const j = await r.json();
    const c = j.content && j.content[0];
    if (c && c.X && c.Y) return mc2wgs(c.X / 100, c.Y / 100);
  } catch (e) {}
  return null;
}

function parseLink(line) {
  const url = line.trim();
  if (!url) return null;
  const pano = (url.match(/[#&?]panoid=([0-9A-Za-z]+)/) || url.match(/[#&?]pid=([0-9A-Za-z]+)/) || [])[1];
  if (!pano) return { error: 'no panoid' };
  const at = url.match(/@(-?[\d.]+),(-?[\d.]+)/);
  const num = k => { const m = url.match(new RegExp('[#&?]' + k + '=(-?[\\d.]+)')); return m ? +m[1] : 0; };
  return { url, panoId: pano, heading: num('heading'), pitch: num('pitch'), mc: at ? [+at[1], +at[2]] : null };
}

document.getElementById('addLinks').addEventListener('click', async () => {
  const lines = document.getElementById('links').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const info = document.getElementById('linkInfo');
  const errors = [];
  let approx = 0, exact = 0;
  setStatus('Processing links…');
  for (const line of lines) {
    const p = parseLink(line);
    if (!p || p.error) { errors.push(`Skipped: ${line.slice(0, 60)}… (${p ? p.error : 'invalid'})`); continue; }
    let pos = await lookupPano(p.panoId), isApprox = false;
    if (!pos && p.mc) { pos = mc2wgs(p.mc[0], p.mc[1]); isApprox = true; }
    if (!pos) { errors.push(`No position for ${p.panoId}`); continue; }
    const old = state.links.find(l => l.panoId === p.panoId);
    state.links = state.links.filter(l => l.panoId !== p.panoId);
    state.links.push({ tags: old ? old.tags : [], url: p.url, panoId: p.panoId, heading: p.heading, pitch: p.pitch, lat: pos[1], lng: pos[0], approx: isApprox });
    isApprox ? approx++ : exact++;
  }
  save(); redraw(true);
  setStatus(errors.join('\n'));
  info.textContent = `Added ${exact} exact, ${approx} approximate.` +
    (approx ? ' Approximate = Baidu lookup blocked by browser, so the map center from the link (@x,y) is used, which is NOT the pano location unless the link is zoomed in.' : '');
});

// ---------- panorama viewer (Pannellum) ----------
// Baidu's own pano tiles are CORS-open: ?qt=pdata&sid=ID&pos=row_col&z=Z, zoom 4 = 8 cols x 4 rows of 512px.
// Bearing at image column u is 360*u - NorthDir (sdata), so the image centre is bearing 180 - NorthDir.
const $ = id => document.getElementById(id);
const BD = 'https://mapsv0.bdimg.com/';
let viewer = null, viewUrl = null, viewToken = 0;
const norm = d => ((d + 540) % 360) - 180;

async function stitch(id, z = 4) {
  const cols = 2 ** (z - 1), rows = 2 ** (z - 2), T = 512;
  const cv = document.createElement('canvas'); cv.width = cols * T; cv.height = rows * T;
  const ctx = cv.getContext('2d'), jobs = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    jobs.push(fetch(`${BD}?qt=pdata&sid=${id}&pos=${r}_${c}&z=${z}`).then(x => x.ok ? x.blob() : null)
      .then(b => b && createImageBitmap(b)).then(bm => bm && ctx.drawImage(bm, c * T, r * T)).catch(() => {}));
  await Promise.all(jobs);
  return new Promise(res => cv.toBlob(res, 'image/jpeg', 0.9));
}
async function showPano(l) {
  const my = ++viewToken;
  $('pv').classList.add('open');
  $('pvTitle').textContent = l.panoId + ' (loading…)';
  let meta = null;
  try { meta = (await (await fetch(`${BD}?qt=sdata&sid=${l.panoId}`)).json()).content[0]; } catch (e) {}
  const blob = await stitch(l.panoId);
  if (my !== viewToken) return;
  if (!blob) { $('pvTitle').textContent = l.panoId + ' (no tiles)'; return; }
  const north = meta ? meta.NorthDir || 0 : 0;
  const yaw = norm((l.heading ?? meta?.Heading ?? 0) - (180 - north));
  if (viewer) { try { viewer.destroy(); } catch (e) {} }
  if (viewUrl) URL.revokeObjectURL(viewUrl);
  viewUrl = URL.createObjectURL(blob);
  $('pvView').innerHTML = '';
  viewer = pannellum.viewer('pvView', { type: 'equirectangular', panorama: viewUrl, autoLoad: true,
    yaw, pitch: l.pitch || 0, hfov: 100, minHfov: 30, maxHfov: 120, showFullscreenCtrl: false, compass: false });
  $('pvTitle').textContent = l.panoId + (meta && meta.Rname ? '  ' + meta.Rname : '');
}
$('pvBig').onclick = () => { $('pv').classList.toggle('big'); viewer && viewer.resize(); };
$('pvClose').onclick = () => { $('pv').classList.remove('open'); viewToken++; };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('pvClose').click(); });

// ---------- export / clear ----------
document.getElementById('exportBtn').addEventListener('click', () => {
  const sel = document.getElementById('tagFilter').value || '__all';
  const show = l => sel === '__all' || (sel === '__none' ? !(l.tags && l.tags.length) : (l.tags || []).includes(sel));
  const all = [];
  for (const f of state.files) for (const l of f.locs) if (show(l)) {
    const o = { lat: l.lat, lng: l.lng, heading: l.heading, pitch: l.pitch, zoom: 0, panoId: l.panoId };
    if (l.tags && l.tags.length) o.extra = { tags: l.tags };
    all.push(o);
  }
  for (const l of state.links) if (show(l))
    all.push({ lat: l.lat, lng: l.lng, heading: l.heading, pitch: l.pitch, zoom: 0, panoId: l.panoId, country: 'CN', source: 'baidu_pano', extra: { tags: ['baidu', ...(l.tags || [])] } });
  if (!all.length) { setStatus('Nothing to export for this selection.'); return; }
  const label = sel === '__all' ? 'all' : sel === '__none' ? 'untagged' : sel;
  const blob = new Blob([JSON.stringify({ name: label, customCoordinates: all })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = label.replace(/[^\w-]+/g, '_') + '.json'; a.click();
});
document.getElementById('clearAll').addEventListener('click', () => {
